name: Validar mazos

on:
  workflow_dispatch:
  push:
    paths:
      - src/data/**
      - src/domain/legality/**
      - src/lib/deck-schemas.ts
      - scripts/validate/**
      - .github/workflows/validate-decks.yml
  pull_request:
    paths:
      - src/data/**
      - src/domain/legality/**
      - src/lib/deck-schemas.ts
      - scripts/validate/**
      - .github/workflows/validate-decks.yml

permissions:
  contents: read

concurrency:
  group: validate-decks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mazos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Falla si hoy no hay formato aplicable o algún mazo es ilegal.
      - run: node scripts/validate/decks.ts >> "$GITHUB_STEP_SUMMARY"
